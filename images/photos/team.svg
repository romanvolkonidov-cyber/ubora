<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Ubora staff team photo placeholder">
  <defs>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#042F2A"/>
    </linearGradient>
    <pattern id="td" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.4" fill="rgba(255,255,255,0.12)"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#tg)"/>
  <rect width="800" height="600" fill="url(#td)"/>
  <circle cx="660" cy="120" r="120" fill="#F59E0B" opacity="0.25"/>
  <!-- simple team silhouettes -->
  <g fill="rgba(255,255,255,0.92)" transform="translate(0 40)">
    <g transform="translate(250 250)"><circle cx="0" cy="0" r="46"/><path d="M-70 150 a70 80 0 0 1 140 0 z"/></g>
    <g transform="translate(400 220)"><circle cx="0" cy="0" r="52"/><path d="M-80 170 a80 90 0 0 1 160 0 z"/></g>
    <g transform="translate(550 250)"><circle cx="0" cy="0" r="46"/><path d="M-70 150 a70 80 0 0 1 140 0 z"/></g>
  </g>
  <g transform="translate(400 520)" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif">
    <g transform="translate(-118 -20)" opacity="0.85">
      <rect x="-16" y="-14" width="32" height="24" rx="4" fill="none" stroke="#fff" stroke-width="2.5"/>
      <circle cx="0" cy="-2" r="7" fill="none" stroke="#fff" stroke-width="2.5"/>
      <rect x="-10" y="-20" width="10" height="6" rx="2" fill="#fff"/>
    </g>
    <text x="20" y="-6" fill="#fff" font-size="26" font-weight="700">The Ubora Team</text>
  </g>
  <text x="400" y="552" text-anchor="middle" fill="rgba(255,255,255,0.65)" font-family="Inter, sans-serif" font-size="15">Replace with a real staff photo · images/photos/team.svg</text>
</svg>
